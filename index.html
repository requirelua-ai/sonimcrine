<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holy Proxy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg:       #080808;
            --bg2:      #111;
            --bg3:      #181818;
            --text:     #c8c8c8;
            --text-dim: #4a4a4a;
            --border:   #1c1c1c;
            --border2:  #252525;
            --ok:       #4ade80;
            --err:      #f87171;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            width: 175px;
            min-height: 100vh;
            background: var(--bg2);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            left: 0; top: 0;
            z-index: 10;
        }

        .sidebar-logo {
            padding: 20px 16px 16px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-logo h1 {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text);
        }
        .sidebar-logo p {
            font-size: 0.67rem;
            color: var(--text-dim);
            margin-top: 3px;
        }

        .sidebar-nav { flex: 1; padding: 10px 0; }
        .nav-item {
            padding: 8px 16px;
            font-size: 0.79rem;
            color: var(--text-dim);
            cursor: pointer;
            border-left: 2px solid transparent;
            transition: all 0.12s;
        }
        .nav-item:hover { color: var(--text); }
        .nav-item.active { color: var(--text); border-left-color: var(--text-dim); }

        .sidebar-conn {
            padding: 14px 16px;
            border-top: 1px solid var(--border);
        }
        .sidebar-conn input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border2);
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.71rem;
            padding: 6px 8px;
            outline: none;
            margin-bottom: 6px;
        }
        .sidebar-conn input:focus { border-color: var(--text-dim); }
        .sidebar-conn input::placeholder { color: var(--text-dim); }
        .btn-connect {
            width: 100%;
            padding: 6px;
            background: transparent;
            border: 1px solid var(--border2);
            color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.73rem;
            cursor: pointer;
            transition: all 0.12s;
        }
        .btn-connect:hover { color: var(--text); border-color: var(--text-dim); }
        .conn-status {
            font-size: 0.67rem;
            color: var(--text-dim);
            margin-top: 6px;
        }
        .conn-status.ok  { color: var(--ok); }
        .conn-status.err { color: var(--err); }

        /* ── MAIN ── */
        .main {
            margin-left: 175px;
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ── CONSOLE PAGE ── */
        #page-console {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #000;
        }

        .terminal-body {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px 6px;
            font-size: 0.82rem;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .tl { margin-bottom: 1px; color: var(--text); }
        .tl.err { color: var(--err); }
        .tl.ok  { color: var(--ok); }
        .tl.dim { color: var(--text-dim); }

        .terminal-input {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            border-top: 1px solid #111;
            background: #000;
            flex-shrink: 0;
        }
        .term-prompt { color: var(--text-dim); font-size: 0.82rem; user-select: none; }
        .term-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            outline: none;
        }
        .term-input:disabled { opacity: 0.3; }

        /* ── SERVERS PAGE ── */
        #page-servers {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding: 22px 26px;
        }

        .page-section-label {
            font-size: 0.7rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 14px;
        }

        .server-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: var(--bg2);
            border: 1px solid var(--border);
            margin-bottom: 5px;
        }
        .server-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex-shrink: 0; }
        .server-name { font-size: 0.82rem; color: var(--text); }
        .server-meta { font-size: 0.7rem; color: var(--text-dim); margin-top: 2px; }
        .server-players { margin-left: auto; font-size: 0.72rem; color: var(--text-dim); }
        .no-servers { font-size: 0.8rem; color: var(--text-dim); }

        /* ── TOOLS PAGE ── */
        #page-tools {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding: 22px 26px;
        }

        .tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 820px) { .tools-grid { grid-template-columns: 1fr; } }
        .col-span-2 { grid-column: 1 / -1; }

        .card {
            background: var(--bg2);
            border: 1px solid var(--border);
            padding: 16px;
        }
        .card-title {
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 14px;
        }

        .form-group { margin-bottom: 11px; }
        label {
            display: block;
            font-size: 0.68rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 4px;
        }
        input[type="text"], input[type="number"], textarea, select {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border2);
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            padding: 7px 9px;
            outline: none;
            transition: border-color 0.12s;
        }
        input:focus, textarea:focus, select:focus { border-color: var(--text-dim); }
        textarea { resize: vertical; min-height: 75px; }
        select option { background: var(--bg2); }
        .num-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .btn {
            width: 100%;
            padding: 8px;
            background: transparent;
            border: 1px solid var(--border2);
            color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.79rem;
            cursor: pointer;
            transition: all 0.12s;
            position: relative;
        }
        .btn:hover { color: var(--text); border-color: var(--text-dim); }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-sm { width: auto; padding: 5px 11px; font-size: 0.74rem; }

        .cooldown-overlay {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.55);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.78rem; color: var(--text-dim);
            pointer-events: none;
        }

        .toast {
            font-size: 0.73rem;
            margin-top: 7px;
            padding: 5px 8px;
            border: 1px solid;
        }
        .toast.ok  { color: var(--ok);  border-color: rgba(74,222,128,0.25); }
        .toast.err { color: var(--err); border-color: rgba(248,113,113,0.25); }

        .mode-switch { display: flex; gap: 5px; margin-bottom: 10px; }
        .mode-btn {
            padding: 4px 10px; border: 1px solid var(--border2);
            background: transparent; color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace; font-size: 0.73rem;
            cursor: pointer; transition: all 0.12s;
        }
        .mode-btn.active { color: var(--text); border-color: var(--text-dim); }

        .progress-bar { width: 100%; height: 3px; background: var(--bg3); margin-top: 8px; }
        .progress-fill { height: 100%; background: var(--text-dim); transition: width 0.3s; }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border2); }
    </style>
</head>
<body>

<nav class="sidebar">
    <div class="sidebar-logo">
        <h1>Holy Proxy</h1>
        <p>Remote Admin</p>
    </div>
    <div class="sidebar-nav">
        <div class="nav-item active" onclick="switchPage('console')" data-page="console">Console</div>
        <div class="nav-item" onclick="switchPage('servers')" data-page="servers">Servers</div>
        <div class="nav-item" onclick="switchPage('tools')" data-page="tools">Tools</div>
    </div>
    <div class="sidebar-conn">
        <input type="text" id="backendUrl" placeholder="ngrok url…">
        <button class="btn-connect" onclick="testConnection()">Connect</button>
        <div class="conn-status" id="connStatus">disconnected</div>
    </div>
</nav>

<div class="main">

    <!-- CONSOLE -->
    <div id="page-console">
        <div class="terminal-body" id="termOut">
            <div class="tl dim">type help for cmds</div>
        </div>
        <div class="terminal-input">
            <span class="term-prompt">&gt;</span>
            <input type="text" class="term-input" id="consoleInput" autocomplete="off" spellcheck="false">
        </div>
    </div>

    <!-- SERVERS -->
    <div id="page-servers">
        <div class="page-section-label">Active Servers</div>
        <div id="serversList"><div class="no-servers">Connect to a backend to see servers</div></div>
    </div>

    <!-- TOOLS -->
    <div id="page-tools">
        <div class="tools-grid">

            <div class="card">
                <div class="card-title">WAV Player</div>
                <form onsubmit="sendWAV(event)">
                    <div class="form-group">
                        <label>Server</label>
                        <select id="wavServer" required><option value="">Select server…</option></select>
                    </div>
                    <div class="form-group">
                        <label>URL</label>
                        <input type="text" id="wavUrl" placeholder="https://…" required>
                    </div>
                    <button class="btn" type="submit" id="wavBtn">Play WAV</button>
                </form>
                <div id="wavStatus"></div>
            </div>

            <div class="card">
                <div class="card-title">Image to Roblox</div>
                <div class="mode-switch">
                    <button type="button" class="mode-btn active" onclick="switchImageMode('file')" id="fileModeBtn">File</button>
                    <button type="button" class="mode-btn" onclick="switchImageMode('url')" id="urlModeBtn">URL</button>
                </div>
                <div id="fileInputSection">
                    <div class="form-group">
                        <label>Image File</label>
                        <input type="file" id="imageFile" accept="image/*" style="padding:6px;font-size:0.76rem;">
                    </div>
                </div>
                <div id="urlInputSection" style="display:none;">
                    <div class="form-group">
                        <label>Image URL</label>
                        <input type="text" id="imageUrl" placeholder="https://…">
                    </div>
                </div>
                <div class="num-row">
                    <div class="form-group">
                        <label>Width (px)</label>
                        <input type="number" id="imgWidth" value="25" min="10" max="100">
                    </div>
                    <div class="form-group">
                        <label>Height (px)</label>
                        <input type="number" id="imgHeight" value="25" min="10" max="100">
                    </div>
                </div>
                <div class="form-group">
                    <label style="display:flex;align-items:center;gap:7px;text-transform:none;letter-spacing:0;font-size:0.76rem;">
                        <input type="checkbox" id="useCompression" checked style="width:auto;"> Compression
                    </label>
                </div>
                <button class="btn" onclick="convertImage()" id="convertBtn">Convert</button>
                <div id="imageStatus"></div>
                <div id="imageOutput" style="display:none;margin-top:12px;">
                    <div class="form-group">
                        <label>Generated Code</label>
                        <textarea id="generatedCode" readonly style="min-height:100px;font-size:0.73rem;"></textarea>
                    </div>
                    <button class="btn btn-sm" onclick="copyCode()" style="margin-bottom:6px;">Copy</button>
                    <div id="imageStats" style="font-size:0.71rem;color:var(--text-dim);margin-top:6px;white-space:pre-line;line-height:1.6;"></div>
                </div>
            </div>

            <div class="card col-span-2">
                <div class="card-title">Video to Roblox</div>
                <div class="form-group">
                    <label>Video File</label>
                    <input type="file" id="videoFile" accept="video/*" style="padding:6px;font-size:0.76rem;">
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
                    <div class="form-group">
                        <label>Width (px)</label>
                        <input type="number" id="videoWidth" value="100" min="10" max="200">
                    </div>
                    <div class="form-group">
                        <label>Height (px)</label>
                        <input type="number" id="videoHeight" value="100" min="10" max="200">
                    </div>
                    <div class="form-group">
                        <label>FPS</label>
                        <input type="number" id="videoFPS" value="5" min="1" max="30">
                    </div>
                </div>
                <div class="form-group">
                    <label>Max Duration (s)</label>
                    <input type="number" id="videoDuration" value="10" min="1" max="60">
                </div>
                <button class="btn" onclick="convertVideo()" id="videoConvertBtn">Convert Video</button>
                <div id="videoProgress" style="display:none;margin-top:8px;">
                    <div class="progress-bar"><div class="progress-fill" id="videoProgressFill" style="width:0%"></div></div>
                    <div style="font-size:0.71rem;color:var(--text-dim);margin-top:4px;" id="videoProgressText">Processing…</div>
                </div>
                <div id="videoStatus"></div>
                <div id="videoOutput" style="display:none;margin-top:12px;">
                    <div class="form-group">
                        <label>Generated Video Code</label>
                        <textarea id="generatedVideoCode" readonly style="min-height:150px;font-size:0.71rem;"></textarea>
                    </div>
                    <div style="display:flex;gap:7px;">
                        <button class="btn btn-sm" onclick="copyVideoCode()">Copy</button>
                        <button class="btn btn-sm" onclick="downloadVideoCode()">Download .txt</button>
                    </div>
                    <div id="videoStats" style="font-size:0.71rem;color:var(--text-dim);margin-top:7px;white-space:pre-line;line-height:1.6;"></div>
                </div>
            </div>

        </div>
    </div>

</div>

<script>
let servers = [];
let backendUrl = localStorage.getItem('backendUrl') || '';
let refreshInterval;
let consoleCooldown = false;
let currentImageMode = 'file';

/* ── PAGE SWITCH ── */
function switchPage(page) {
    document.getElementById('page-console').style.display  = page === 'console'  ? 'flex'  : 'none';
    document.getElementById('page-servers').style.display  = page === 'servers'  ? 'block' : 'none';
    document.getElementById('page-tools').style.display    = page === 'tools'    ? 'block' : 'none';
    document.querySelectorAll('.nav-item').forEach(el => {
        el.classList.toggle('active', el.dataset.page === page);
    });
    if (page === 'console') consoleInput.focus();
}

/* ── CONNECTION ── */
async function testConnection() {
    const url = document.getElementById('backendUrl').value.trim().replace(/\/$/,'');
    if (!url) return;
    localStorage.setItem('backendUrl', url);
    backendUrl = url;
    setConnStatus(null);
    try {
        const r = await fetch(`${url}/latestservers`, { headers: {'ngrok-skip-browser-warning':'69420'} });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const d = await r.json();
        servers = d.servers || [];
        setConnStatus(true, servers.length);
        renderServers(); updateSelects();
        if (refreshInterval) clearInterval(refreshInterval);
        refreshInterval = setInterval(loadServers, 5000);
    } catch(err) { setConnStatus(false); }
}

function setConnStatus(ok, count) {
    const el = document.getElementById('connStatus');
    if (ok === null) { el.textContent = 'connecting…'; el.className = 'conn-status'; return; }
    if (ok) { el.textContent = `connected (${count})`; el.className = 'conn-status ok'; }
    else { el.textContent = 'disconnected'; el.className = 'conn-status err'; }
}

async function loadServers() {
    if (!backendUrl) return;
    try {
        const r = await fetch(`${backendUrl}/latestservers`, { headers: {'ngrok-skip-browser-warning':'69420'} });
        if (!r.ok) throw new Error();
        const d = await r.json();
        servers = d.servers || [];
        renderServers(); updateSelects();
        setConnStatus(true, servers.length);
    } catch { setConnStatus(false); }
}

function renderServers() {
    const el = document.getElementById('serversList');
    if (!servers.length) { el.innerHTML = '<div class="no-servers">No active servers</div>'; return; }
    el.innerHTML = servers.map(s => `
        <div class="server-item">
            <div class="server-dot"></div>
            <div>
                <div class="server-name">${s.serverId} — ${s.name||'Unnamed'}</div>
                <div class="server-meta">Place ${s.placeId} · Job ${(s.jobId||'?').substring(0,16)}…</div>
            </div>
            <div class="server-players">${s.players||0} online</div>
        </div>
    `).join('');
}

function updateSelects() {
    const opts = servers.map(s => `<option value="${s.serverId}">${s.serverId} — ${s.name||'?'} (${s.players||0})</option>`).join('');
    const ph = '<option value="">Select server…</option>';
    ['wavServer'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.innerHTML = ph + opts;
    });
}

/* ── TOAST ── */
function toast(id, msg, ok=true) {
    const el = document.getElementById(id);
    if (!el) return;
    el.innerHTML = `<div class="toast ${ok?'ok':'err'}">${msg}</div>`;
    setTimeout(() => el.innerHTML = '', 5000);
}

/* ── BTN COOLDOWN ── */
function startBtnCooldown(btnId, secs) {
    const btn = document.getElementById(btnId);
    btn.disabled = true;
    const ov = document.createElement('div');
    ov.className = 'cooldown-overlay';
    let r = secs; ov.textContent = r + 's';
    btn.appendChild(ov);
    const iv = setInterval(() => {
        r--;
        if (r > 0) { ov.textContent = r + 's'; }
        else { clearInterval(iv); btn.removeChild(ov); btn.disabled = false; }
    }, 1000);
}

/* ── WAV ── */
async function sendWAV(e) {
    e.preventDefault();
    if (!backendUrl) return toast('wavStatus','Connect to backend first',false);
    const data = { serverId: document.getElementById('wavServer').value, url: document.getElementById('wavUrl').value.trim() };
    if (!data.url) return toast('wavStatus','URL cannot be empty',false);
    try {
        const r = await fetch(`${backendUrl}/api/sound`, {
            method:'POST', headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'69420'},
            body: JSON.stringify(data)
        });
        const j = await r.json();
        if (j.success) { toast('wavStatus',`WAV #${j.wavNum||'?'} queued`); document.getElementById('wavUrl').value=''; startBtnCooldown('wavBtn',2); }
        else toast('wavStatus', j.error||'Failed', false);
    } catch(err) { toast('wavStatus', err.message, false); }
}

/* ── IMAGE ── */
function switchImageMode(mode) {
    currentImageMode = mode;
    document.getElementById('fileInputSection').style.display = mode==='file'?'':'none';
    document.getElementById('urlInputSection').style.display  = mode==='url'?'':'none';
    document.getElementById('fileModeBtn').classList.toggle('active', mode==='file');
    document.getElementById('urlModeBtn').classList.toggle('active', mode==='url');
}

function isCloseToBlack(r,g,b,t=10){return r<t&&g<t&&b<t;}

function compressColors(colors) {
    if (!colors.length) return [];
    const out=[]; let cur=colors[0],cnt=1;
    for(let i=1;i<colors.length;i++){
        if(colors[i]===cur){cnt++;}
        else{cnt>2?out.push(`${cur}*${cnt}`):Array.from({length:cnt},()=>out.push(cur));cur=colors[i];cnt=1;}
    }
    cnt>2?out.push(`${cur}*${cnt}`):Array.from({length:cnt},()=>out.push(cur));
    return out;
}

async function convertImage() {
    const w=parseInt(document.getElementById('imgWidth').value);
    const h=parseInt(document.getElementById('imgHeight').value);
    const useComp=document.getElementById('useCompression').checked;
    let src;
    if(currentImageMode==='file'){
        const f=document.getElementById('imageFile');
        if(!f.files||!f.files.length){toast('imageStatus','Select an image file',false);return;}
        src=f.files[0];
    } else {
        const u=document.getElementById('imageUrl').value.trim();
        if(!u){toast('imageStatus','Enter image URL',false);return;}
        src=u;
    }
    toast('imageStatus','Converting…',true);
    try {
        const img=new Image(); img.crossOrigin='anonymous';
        await new Promise((res,rej)=>{
            img.onload=res; img.onerror=()=>rej(new Error('Failed to load'));
            if(typeof src==='string'){img.src=src;}
            else{const rd=new FileReader();rd.onload=e=>{img.src=e.target.result;};rd.onerror=()=>rej(new Error('Read error'));rd.readAsDataURL(src);}
        });
        const cvs=document.createElement('canvas'); cvs.width=w; cvs.height=h;
        const ctx=cvs.getContext('2d'); ctx.drawImage(img,0,0,w,h);
        const px=ctx.getImageData(0,0,w,h).data;
        const all=[];
        for(let i=0;i<px.length;i+=4){
            const r=px[i],g=px[i+1],b=px[i+2];
            all.push(isCloseToBlack(r,g,b)?'a':((r<<16)|(g<<8)|b).toString(16).padStart(6,'0'));
        }
        const cd=useComp?compressColors(all):all;
        const code=`${w}x${h}\n${cd.join(' ')}`;
        const origLen=all.join(' ').length;
        const compLen=code.length;
        document.getElementById('generatedCode').value=code;
        document.getElementById('imageOutput').style.display='';
        const LIMIT=200;
        let stats=`${w}x${h} · ${all.length} pixels · ${compLen} chars`;
        if(useComp) stats+=` · ${((1-compLen/origLen)*100).toFixed(1)}% compression`;
        stats+='\n'+(code.length<LIMIT?'fits in one chat message':`needs ${Math.ceil(code.length/LIMIT)} messages`);
        document.getElementById('imageStats').textContent=stats;
        toast('imageStatus','done',true);
    } catch(err){toast('imageStatus','error: '+err.message,false);}
}

function copyCode(){document.getElementById('generatedCode').select();document.execCommand('copy');}

/* ── VIDEO ── */
async function convertVideo() {
    const fi=document.getElementById('videoFile');
    if(!fi.files||!fi.files.length){toast('videoStatus','Select a video file',false);return;}
    const w=parseInt(document.getElementById('videoWidth').value);
    const h=parseInt(document.getElementById('videoHeight').value);
    const fps=parseInt(document.getElementById('videoFPS').value);
    const dur=parseInt(document.getElementById('videoDuration').value);
    document.getElementById('videoProgress').style.display='';
    document.getElementById('videoOutput').style.display='none';
    updVidProg(10,'loading…');
    try {
        const vid=document.createElement('video');
        vid.src=URL.createObjectURL(fi.files[0]); vid.muted=true;
        await new Promise((res,rej)=>{vid.onloadedmetadata=res;vid.onerror=()=>rej(new Error('load failed'));});
        const vd=Math.min(vid.duration,dur);
        const fi2=1/fps;
        const tf=Math.floor(vd*fps);
        updVidProg(20,`${tf} frames…`);
        const cvs=document.createElement('canvas'); cvs.width=w; cvs.height=h;
        const ctx=cvs.getContext('2d');
        const frames=[];
        for(let i=0;i<tf;i++){
            vid.currentTime=i*fi2;
            await new Promise(r=>{vid.onseeked=r;});
            ctx.drawImage(vid,0,0,w,h);
            const px=ctx.getImageData(0,0,w,h).data;
            const fc=[];
            for(let j=0;j<px.length;j+=4){
                const r=px[j],g=px[j+1],b=px[j+2];
                fc.push(isCloseToBlack(r,g,b)?'a':((r<<16)|(g<<8)|b).toString(16).padStart(6,'0').toUpperCase());
            }
            frames.push(`FRAME${i+1}, ${fc.join(' ')}`);
            updVidProg(20+Math.floor((i/tf)*70),`frame ${i+1}/${tf}`);
        }
        updVidProg(95,'generating…');
        const code=`${w}x${h}\n${fps}\n${frames.join('\n')}`;
        document.getElementById('generatedVideoCode').value=code;
        document.getElementById('videoOutput').style.display='';
        updVidProg(100,'done');
        document.getElementById('videoStats').textContent=`${w}x${h} · ${fps}fps · ${tf} frames · ${vd.toFixed(1)}s\n${code.length.toLocaleString()} chars`;
        toast('videoStatus','done',true);
        URL.revokeObjectURL(vid.src);
        setTimeout(()=>document.getElementById('videoProgress').style.display='none',2000);
    } catch(err){toast('videoStatus','error: '+err.message,false);document.getElementById('videoProgress').style.display='none';}
}

function updVidProg(pct,txt){
    document.getElementById('videoProgressFill').style.width=pct+'%';
    document.getElementById('videoProgressText').textContent=txt;
}
function copyVideoCode(){document.getElementById('generatedVideoCode').select();document.execCommand('copy');}
function downloadVideoCode(){
    const b=new Blob([document.getElementById('generatedVideoCode').value],{type:'text/plain'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='video_code.txt'; a.click();
}

/* ── CONSOLE ── */
const termOut = document.getElementById('termOut');
const consoleInput = document.getElementById('consoleInput');

function tl(text, cls) {
    const d = document.createElement('div');
    d.className = 'tl' + (cls ? ' '+cls : '');
    d.textContent = text;
    termOut.appendChild(d);
    termOut.scrollTop = termOut.scrollHeight;
}

async function apiPost(endpoint, data) {
    if (!backendUrl) { tl('not connected', 'err'); return null; }
    try {
        const r = await fetch(`${backendUrl}/api/${endpoint}`, {
            method:'POST',
            headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'69420'},
            body: JSON.stringify(data)
        });
        return await r.json();
    } catch(err) { tl('network error: '+err.message, 'err'); return null; }
}

async function apiGet(path) {
    if (!backendUrl) { tl('not connected', 'err'); return null; }
    try {
        const r = await fetch(`${backendUrl}${path}`, { headers: {'ngrok-skip-browser-warning':'69420'} });
        return await r.json();
    } catch(err) { tl('network error: '+err.message, 'err'); return null; }
}

function startConsCooldown(secs) {
    consoleCooldown = true;
    consoleInput.disabled = true;
    const iv = setInterval(() => {
        secs--;
        if (secs <= 0) {
            clearInterval(iv);
            consoleInput.disabled = false;
            consoleCooldown = false;
            consoleInput.focus();
        }
    }, 1000);
}

async function handleCommand(raw) {
    const cmd = raw.trim();
    if (!cmd) return;
    if (consoleCooldown) return;

    tl('> ' + cmd, 'dim');
    const parts = cmd.split(/\s+/);
    const action = parts[0].toLowerCase();
    const args = parts.slice(1);

    switch (action) {

        case 'help': case 'cmds':
            tl('');
            tl('help / cmds', 'dim');
            tl('servers', 'dim');
            tl('plrs <sid>', 'dim');
            tl('kick <sid> <name> [reason]', 'dim');
            tl('ban  <sid> <name> [reason]', 'dim');
            tl('kill <sid> <name>', 'dim');
            tl('hint <sid> <message>', 'dim');
            tl('run  <sid> <luau code>', 'dim');
            tl('');
            startConsCooldown(1);
            break;

        case 'servers': {
            const d = await apiGet('/latestservers');
            if (!d) break;
            servers = d.servers || [];
            renderServers(); updateSelects();
            if (!servers.length) { tl('no active servers', 'dim'); break; }
            servers.forEach(s => tl(`  ${s.serverId}  ${s.name||'?'}  (${s.players||0})`, 'dim'));
            startConsCooldown(1);
            break;
        }

        case 'plrs': {
            if (!args[0]) { tl('usage: plrs <sid>', 'err'); break; }
            const d = await apiGet(`/api/players/${args[0]}`);
            if (!d) break;
            if (!d.success) { tl(d.error||'failed', 'err'); break; }
            const pl = d.players || [];
            if (!pl.length) tl('no players online', 'dim');
            else pl.forEach(p => tl(`  ${p.name}  (${p.userId})`, 'dim'));
            startConsCooldown(2);
            break;
        }

        case 'kick': case 'ban': case 'kill': {
            if (args.length < 2) { tl(`usage: ${action} <sid> <name> [reason]`, 'err'); break; }
            const d = await apiPost(action, { serverId:args[0], playerName:args[1], reason:args.slice(2).join(' ')||'No reason provided' });
            if (!d) break;
            if (d.success) tl(`${action} #${d.modNum||'?'} queued — ${args[1]}`, 'ok');
            else tl(d.error||'failed', 'err');
            startConsCooldown(2);
            break;
        }

        case 'hint': {
            if (args.length < 2) { tl('usage: hint <sid> <message>', 'err'); break; }
            const d = await apiPost('hint', { serverId:args[0], message:args.slice(1).join(' '), typeSpeed:0.05, displayTime:3 });
            if (!d) break;
            if (d.success) tl(`hint #${d.hintNum||'?'} queued`, 'ok');
            else tl(d.error||'failed', 'err');
            startConsCooldown(2);
            break;
        }

        case 'run': {
            if (args.length < 2) { tl('usage: run <sid> <luau code>', 'err'); break; }
            const d = await apiPost('run', { serverId:args[0], code:args.slice(1).join(' ') });
            if (!d) break;
            if (d.success) tl(`run #${d.runNum||'?'} queued`, 'ok');
            else tl(d.error||'failed', 'err');
            startConsCooldown(2);
            break;
        }

        default:
            tl('unknown: ' + action, 'err');
            startConsCooldown(1);
    }
}

consoleInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
        e.preventDefault();
        const v = consoleInput.value;
        consoleInput.value = '';
        if (v.trim()) handleCommand(v);
    }
});
termOut.addEventListener('click', () => { if (!consoleCooldown) consoleInput.focus(); });

/* ── BOOT ── */
window.addEventListener('DOMContentLoaded', () => {
    if (backendUrl) {
        document.getElementById('backendUrl').value = backendUrl;
        testConnection();
    }
    consoleInput.focus();
});
</script>
