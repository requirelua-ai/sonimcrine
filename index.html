<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holy admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg: #0d0d0d;
            --bg-lighter: #1a1a1a;
            --green: #00ff41;
            --green-dim: #00cc33;
            --green-darker: #009929;
            --text: #e0e0e0;
            --text-dim: #888;
            --border: #222;
        }
        body {
            font-family: 'IBM Plex Mono', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            display: flex;
        }
        
        /* Spinner Sidebar */
        .spinner-sidebar {
            width: 120px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            background: var(--bg-lighter);
            border-right: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .spinner {
            width: 70.4px;
            height: 70.4px;
            --clr: var(--green);
            --clr-alpha: rgba(0, 255, 65, 0.1);
            animation: spinner 1.6s infinite ease;
            transform-style: preserve-3d;
        }
        .spinner > div {
            background-color: var(--clr-alpha);
            height: 100%;
            position: absolute;
            width: 100%;
            border: 3.5px solid var(--clr);
        }
        .spinner div:nth-of-type(1) {
            transform: translateZ(-35.2px) rotateY(180deg);
        }
        .spinner div:nth-of-type(2) {
            transform: rotateY(-270deg) translateX(50%);
            transform-origin: top right;
        }
        .spinner div:nth-of-type(3) {
            transform: rotateY(270deg) translateX(-50%);
            transform-origin: center left;
        }
        .spinner div:nth-of-type(4) {
            transform: rotateX(90deg) translateY(-50%);
            transform-origin: top center;
        }
        .spinner div:nth-of-type(5) {
            transform: rotateX(-90deg) translateY(50%);
            transform-origin: bottom center;
        }
        .spinner div:nth-of-type(6) {
            transform: translateZ(35.2px);
        }
        @keyframes spinner {
            0% {
                transform: rotate(45deg) rotateX(-25deg) rotateY(25deg);
            }
            50% {
                transform: rotate(45deg) rotateX(-385deg) rotateY(25deg);
            }
            100% {
                transform: rotate(45deg) rotateX(-385deg) rotateY(385deg);
            }
        }
        
        .main-content {
            margin-left: 120px;
            flex: 1;
        }
        
        .container { max-width:1200px; margin:0 auto; padding:40px 20px; }
        header { margin-bottom:50px; border-bottom:1px solid var(--border); padding-bottom:20px; }
        h1 { font-size:2rem; font-weight:500; color:var(--green); margin-bottom:8px; }
        .subtitle { font-size:0.9rem; color:var(--text-dim); }
        .tabs { display:flex; gap:10px; margin-bottom:30px; border-bottom:1px solid var(--border); }
        .tab {
            padding:12px 24px;
            background:transparent;
            border:none;
            color:var(--text-dim);
            font-family:'IBM Plex Mono',monospace;
            font-size:0.9rem;
            font-weight:500;
            cursor:pointer;
            transition:all 0.2s;
            border-bottom:2px solid transparent;
        }
        .tab:hover { color:var(--text); }
        .tab.active { color:var(--green); border-bottom-color:var(--green); }
        .tab-content { display:none; }
        .tab-content.active { display:block; }
        .config-section {
            background:var(--bg-lighter);
            border:1px solid var(--green-darker);
            padding:24px;
            margin-bottom:30px;
        }
        .config-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
        .config-header h3 { font-size:1rem; font-weight:500; color:var(--green); }
        .grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }
        @media (max-width:1024px) { .grid { grid-template-columns:1fr; } }
        .card { background:var(--bg-lighter); border:1px solid var(--border); padding:24px; }
        .card h2 { font-size:1.1rem; font-weight:500; color:var(--green); margin-bottom:20px; }
        .form-group { margin-bottom:18px; }
        label { display:block; margin-bottom:6px; font-size:0.85rem; color:var(--text-dim); font-weight:500; }
        input, textarea, select {
            width:100%;
            padding:10px 12px;
            background:var(--bg);
            border:1px solid var(--border);
            color:var(--text);
            font-family:'IBM Plex Mono',monospace;
            font-size:0.9rem;
            transition:border-color 0.2s;
        }
        input:focus, textarea:focus, select:focus { outline:none; border-color:var(--green-darker); }
        textarea { resize:vertical; min-height:100px; }
        .number-input-group { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        button {
            width:100%;
            padding:12px;
            background:var(--green);
            border:none;
            color:var(--bg);
            font-family:'IBM Plex Mono',monospace;
            font-size:0.9rem;
            font-weight:600;
            cursor:pointer;
            transition:background 0.2s;
            position: relative;
        }
        button:hover { background:var(--green-dim); }
        button:active { background:var(--green-darker); }
        button:disabled { 
            opacity:0.5; 
            cursor:not-allowed;
            background:var(--text-dim);
        }
        .cooldown-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            color: var(--text);
            pointer-events: none;
        }
        .servers-grid { display:grid; gap:10px; }
        .server-item {
            background:var(--bg);
            border:1px solid var(--border);
            padding:14px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            transition:border-color 0.2s;
        }
        .server-item:hover { border-color:var(--green-darker); }
        .server-info { flex:1; }
        .server-name { font-weight:500; color:var(--green); font-size:0.95rem; margin-bottom:4px; }
        .server-details { font-size:0.8rem; color:var(--text-dim); }
        .server-players {
            background:var(--green);
            color:var(--bg);
            padding:4px 10px;
            font-size:0.85rem;
            font-weight:600;
        }
        .no-servers { text-align:center; padding:30px; color:var(--text-dim); }
        .status-message { margin-top:14px; padding:10px 12px; font-size:0.85rem; border:1px solid; }
        .status-success { background:rgba(0,255,65,0.1); border-color:var(--green-darker); color:var(--green); }
        .status-error { background:rgba(255,0,0,0.1); border-color:#8b0000; color:#ff4444; }
        .full-width { grid-column:1 / -1; }
        .connection-status { font-size:0.85rem; font-weight:500; padding:4px 10px; border:1px solid; }
        .connected { background:rgba(0,255,65,0.1); color:var(--green); border-color:var(--green-darker); }
        .disconnected { background:rgba(255,0,0,0.1); color:#ff4444; border-color:#8b0000; }

        .terminal {
            background:#0a0a0a;
            border:1px solid #222;
            padding:16px;
            min-height:320px;
            max-height:520px;
            overflow-y:auto;
            font-size:0.95rem;
            line-height:1.45;
            margin-bottom:16px;
            white-space:pre-wrap;
            word-break:break-word;
            border-radius:4px;
        }
        .terminal-line { margin-bottom:3px; }
        .prompt { color:var(--green); margin-right:8px; user-select:none; }
        .command-input {
            flex:1;
            background:transparent;
            border:none;
            color:var(--text);
            font-family:'IBM Plex Mono',monospace;
            font-size:0.95rem;
            outline:none;
        }
        .error { color:#ff5555; }
        .success { color:var(--green); }
        .info { color:#55aaff; }
        .input-line { display:flex; align-items:center; }
        .player-list { margin:8px 0; padding-left:20px; color:#aaa; }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background: var(--bg);
            border: 1px solid var(--border);
            margin-top: 10px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: var(--green);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            color: var(--bg);
            font-weight: 600;
        }
        
        @media (max-width: 768px) {
            .spinner-sidebar {
                width: 80px;
            }
            .main-content {
                margin-left: 80px;
            }
            .spinner {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="spinner-sidebar">
        <div class="spinner">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
    </div>
    
    <div class="main-content">
        <div class="container">
            <header>
                <h1>Holy Proxy</h1>
                <p class="subtitle">Remote admin</p>
            </header>

            <div class="config-section">
                <div class="config-header">
                    <h3>Backend Configuration</h3>
                    <span id="connectionStatus" class="connection-status disconnected">Disconnected</span>
                </div>
                <div class="form-group">
                    <label for="backendUrl">Backend URL</label>
                    <input type="text" id="backendUrl" placeholder="https://your-ngrok-url.ngrok-free.app" value="">
                </div>
                <button onclick="testConnection()">Connect</button>
                <div id="configStatus"></div>
            </div>

            <div class="tabs">
                <button class="tab active" onclick="switchTab('admin')">Admin</button>
                <button class="tab" onclick="switchTab('console')">Console</button>
                <button class="tab" onclick="switchTab('tools')">Tools</button>
            </div>

            <div id="adminTab" class="tab-content active">
                <div class="grid">
                    <div class="card">
                        <h2>Send Hint</h2>
                        <form id="hintForm" onsubmit="sendHint(event)">
                            <div class="form-group">
                                <label for="hintServer">Server</label>
                                <select id="hintServer" required><option value="">Select server...</option></select>
                            </div>
                            <div class="form-group">
                                <label for="hintMessage">Message</label>
                                <textarea id="hintMessage" placeholder="Enter hint message..." required></textarea>
                            </div>
                            <div class="number-input-group">
                                <div class="form-group">
                                    <label for="typeSpeed">Type Speed (s)</label>
                                    <input type="number" id="typeSpeed" value="0.05" step="0.01" min="0.01">
                                </div>
                                <div class="form-group">
                                    <label for="displayTime">Display (s)</label>
                                    <input type="number" id="displayTime" value="3" step="0.5" min="0.5">
                                </div>
                            </div>
                            <button type="submit" id="hintBtn">Send</button>
                        </form>
                        <div id="hintStatus"></div>
                    </div>

                    <div class="card">
                        <h2>Execute Code</h2>
                        <form id="runForm" onsubmit="runCode(event)">
                            <div class="form-group">
                                <label for="runServer">Server</label>
                                <select id="runServer" required><option value="">Select server...</option></select>
                            </div>
                            <div class="form-group">
                                <label for="runCode">Luau Code</label>
                                <textarea id="runCode" placeholder="print('Hello from proxy')" required></textarea>
                            </div>
                            <button type="submit" id="runBtn">Execute</button>
                        </form>
                        <div id="runStatus"></div>
                    </div>

                    <div class="card full-width">
                        <h2>Active Servers</h2>
                        <div id="serversList" class="servers-grid">
                            <div class="no-servers">Configure backend URL to see servers</div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="consoleTab" class="tab-content">
                <div class="card">
                    <h2>Console</h2>
                    <div class="terminal" id="terminalOutput">
                        <div class="terminal-line info">Console ready — type <span style="color:var(--green)">cmds</span> for help</div>
                        <div class="terminal-line"></div>
                    </div>

                    <div class="input-line">
                        <span class="prompt">&gt;</span>
                        <input type="text" id="consoleInput" class="command-input" placeholder="type command..." autocomplete="off" autofocus>
                    </div>
                </div>
            </div>

            <div id="toolsTab" class="tab-content">
                <div class="grid">
                    <div class="card">
                        <h2>WAV Player</h2>
                        <form id="wavForm" onsubmit="sendWAV(event)">
                            <div class="form-group">
                                <label for="wavServer">Server</label>
                                <select id="wavServer" required><option value="">Select server...</option></select>
                            </div>
                            <div class="form-group">
                                <label for="wavUrl">URL</label>
                                <input type="text" id="wavUrl" placeholder="usecatbox" required>
                            </div>
                            <button type="submit" id="wavBtn">Play WAV</button>
                        </form>
                        <div id="wavStatus"></div>
                    </div>

                    <div class="card">
                        <h2>Image to Roblox Converter</h2>
                        <div class="form-group">
                            <label>Input Method</label>
                            <div style="display:flex;gap:10px;margin-bottom:12px;">
                                <button type="button" onclick="switchImageMode('file')" id="fileModeBtn" style="width:auto;padding:8px 16px;background:var(--green);">File Upload</button>
                                <button type="button" onclick="switchImageMode('url')" id="urlModeBtn" style="width:auto;padding:8px 16px;background:var(--bg-lighter);border:1px solid var(--border);">Image URL</button>
                            </div>
                        </div>

                        <div id="fileInputSection">
                            <div class="form-group">
                                <label for="imageFile">Select Image</label>
                                <input type="file" id="imageFile" accept="image/*" style="padding:8px;">
                            </div>
                        </div>

                        <div id="urlInputSection" style="display:none;">
                            <div class="form-group">
                                <label for="imageUrl">Image URL</label>
                                <input type="text" id="imageUrl" placeholder="https://example.com/image.png">
                            </div>
                        </div>

                        <div class="number-input-group">
                            <div class="form-group">
                                <label for="imgWidth">Width (px)</label>
                                <input type="number" id="imgWidth" value="25" min="10" max="100">
                            </div>
                            <div class="form-group">
                                <label for="imgHeight">Height (px)</label>
                                <input type="number" id="imgHeight" value="25" min="10" max="100">
                            </div>
                        </div>

                        <div class="form-group">
                            <label style="display:flex;align-items:center;cursor:pointer;">
                                <input type="checkbox" id="useCompression" checked style="width:auto;margin-right:8px;">
                                Use compression
                            </label>
                        </div>

                        <button onclick="convertImage()" id="convertBtn">Convert Image</button>
                        <div id="imageStatus"></div>

                        <div id="imageOutput" style="display:none;margin-top:20px;">
                            <div class="form-group">
                                <label>Generated Code</label>
                                <textarea id="generatedCode" readonly style="min-height:150px;font-size:0.8rem;"></textarea>
                            </div>
                            <button onclick="copyCode()" style="background:var(--green-darker);">Copy to Clipboard</button>
                            <div style="margin-top:12px;padding:12px;background:var(--bg);border:1px solid var(--border);font-size:0.85rem;" id="imageStats"></div>
                        </div>
                    </div>

                    <div class="card full-width">
                        <h2>Video to Roblox Converter</h2>
                        <p style="font-size:0.85rem;color:var(--text-dim);margin-bottom:16px;">
                            Convert videos.
                        </p>
                        
                        <div class="form-group">
                            <label for="videoFile">Select Video</label>
                            <input type="file" id="videoFile" accept="video/*" style="padding:8px;">
                        </div>

                        <div class="grid" style="grid-template-columns:1fr 1fr 1fr;gap:12px;">
                            <div class="form-group">
                                <label for="videoWidth">Width (px)</label>
                                <input type="number" id="videoWidth" value="100" min="10" max="200">
                            </div>
                            <div class="form-group">
                                <label for="videoHeight">Height (px)</label>
                                <input type="number" id="videoHeight" value="100" min="10" max="200">
                            </div>
                            <div class="form-group">
                                <label for="videoFPS">FPS</label>
                                <input type="number" id="videoFPS" value="5" min="1" max="30">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="videoDuration">Max Duration (seconds)</label>
                            <input type="number" id="videoDuration" value="10" min="1" max="60">
                        </div>

                        <button onclick="convertVideo()" id="videoConvertBtn">Convert Video</button>
                        
                        <div id="videoProgress" style="display:none;margin-top:12px;">
                            <div class="progress-bar">
                                <div class="progress-fill" id="videoProgressFill" style="width:0%;">0%</div>
                            </div>
                            <div style="margin-top:8px;font-size:0.85rem;color:var(--text-dim);" id="videoProgressText">Processing...</div>
                        </div>
                        
                        <div id="videoStatus"></div>

                        <div id="videoOutput" style="display:none;margin-top:20px;">
                            <div class="form-group">
                                <label>Generated Video Code</label>
                                <textarea id="generatedVideoCode" readonly style="min-height:200px;font-size:0.75rem;"></textarea>
                            </div>
                            <button onclick="copyVideoCode()" style="background:var(--green-darker);">Copy to Clipboard</button>
                            <button onclick="downloadVideoCode()" style="background:var(--green-darker);margin-top:8px;">Download as .txt</button>
                            <div style="margin-top:12px;padding:12px;background:var(--bg);border:1px solid var(--border);font-size:0.85rem;white-space:pre-line;" id="videoStats"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let servers = [];
        let backendUrl = localStorage.getItem('backendUrl') || '';
        let refreshInterval;
        
        let adminCooldown = false;
        let consoleCooldown = false;
        let adminCooldownTimer = null;
        let consoleCooldownTimer = null;
        let currentImageMode = 'file';

        window.addEventListener('DOMContentLoaded', () => {
            if (backendUrl) {
                document.getElementById('backendUrl').value = backendUrl;
                testConnection();
            }
        });

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(tabName + 'Tab').classList.add('active');
            if (tabName === 'console') document.getElementById('consoleInput').focus();
        }

        function getBackendUrl() {
            const url = document.getElementById('backendUrl').value.trim();
            if (!url) {
                showStatus('configStatus', 'Please enter a backend URL', true);
                return null;
            }
            return url.replace(/\/$/, '');
        }

        async function testConnection() {
            const url = getBackendUrl();
            if (!url) return;
            localStorage.setItem('backendUrl', url);
            backendUrl = url;
            showStatus('configStatus', 'Testing connection...', false);
            try {
                const res = await fetch(`${url}/latestservers`, {
                    headers: { 'ngrok-skip-browser-warning': '69420' }
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                showStatus('configStatus', `Connected — ${data.count || data.servers?.length || 0} server(s)`, false);
                updateConnectionStatus(true);
                loadServers();
                if (refreshInterval) clearInterval(refreshInterval);
                refreshInterval = setInterval(loadServers, 5000);
            } catch (err) {
                showStatus('configStatus', `Connection failed: ${err.message}`, true);
                updateConnectionStatus(false);
            }
        }

        function updateConnectionStatus(connected) {
            const el = document.getElementById('connectionStatus');
            el.className = 'connection-status ' + (connected ? 'connected' : 'disconnected');
            el.textContent = connected ? 'Connected' : 'Disconnected';
        }

        async function loadServers() {
            if (!backendUrl) return;
            try {
                const res = await fetch(`${backendUrl}/latestservers`, {
                    headers: { 'ngrok-skip-browser-warning': '69420' }
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                servers = data.servers || [];
                updateServersList();
                updateServerSelects();
                updateConnectionStatus(true);
            } catch (err) {
                console.error(err);
                updateConnectionStatus(false);
            }
        }

        function updateServersList() {
            const container = document.getElementById('serversList');
            if (servers.length === 0) {
                container.innerHTML = '<div class="no-servers">No active servers</div>';
                return;
            }
            container.innerHTML = servers.map(s => `
                <div class="server-item">
                    <div class="server-info">
                        <div class="server-name">${s.serverId} - ${s.name || 'Unnamed'}</div>
                        <div class="server-details">Place ${s.placeId} • Job ${s.jobId?.substring(0,16)||'?'}...</div>
                    </div>
                    <div class="server-players">${s.players||0} players</div>
                </div>
            `).join('');
        }

        function updateServerSelects() {
            const hint = document.getElementById('hintServer');
            const run = document.getElementById('runServer');
            const wav = document.getElementById('wavServer');
            const opts = servers.map(s => 
                `<option value="${s.serverId}">${s.serverId} - ${s.name||'?'} (${s.players||0})</option>`
            ).join('');
            const ph = '<option value="">Select server...</option>';
            hint.innerHTML = ph + opts;
            run.innerHTML = ph + opts;
            wav.innerHTML = ph + opts;
        }

        function showStatus(id, msg, isError = false) {
            const el = document.getElementById(id);
            const cls = isError ? 'status-error' : 'status-success';
            el.innerHTML = `<div class="status-message ${cls}">${msg}</div>`;
            setTimeout(() => el.innerHTML = '', 6000);
        }

        function startAdminCooldown(buttonId, seconds) {
            adminCooldown = true;
            const btn = document.getElementById(buttonId);
            btn.disabled = true;
            
            let remaining = seconds;
            const overlay = document.createElement('div');
            overlay.className = 'cooldown-overlay';
            overlay.textContent = `${remaining}s`;
            btn.appendChild(overlay);
            
            const interval = setInterval(() => {
                remaining--;
                if (remaining > 0) {
                    overlay.textContent = `${remaining}s`;
                } else {
                    clearInterval(interval);
                    btn.removeChild(overlay);
                    btn.disabled = false;
                    adminCooldown = false;
                }
            }, 1000);
        }

        async function sendHint(e) {
            e.preventDefault();
            if (adminCooldown) {
                showStatus('hintStatus', 'Please wait for cooldown', true);
                return;
            }
            if (!backendUrl) return showStatus('hintStatus', 'Configure backend first', true);
            const data = {
                serverId: document.getElementById('hintServer').value,
                message: document.getElementById('hintMessage').value.trim(),
                typeSpeed: parseFloat(document.getElementById('typeSpeed').value),
                displayTime: parseFloat(document.getElementById('displayTime').value)
            };
            if (!data.message) return showStatus('hintStatus', 'Message cannot be empty', true);
            try {
                const res = await fetch(`${backendUrl}/api/hint`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': '69420' },
                    body: JSON.stringify(data)
                });
                const r = await res.json();
                if (r.success) {
                    showStatus('hintStatus', `Hint #${r.hintNum || '?'} queued`, false);
                    document.getElementById('hintMessage').value = '';
                    startAdminCooldown('hintBtn', 2);
                } else {
                    showStatus('hintStatus', r.error || 'Request failed', true);
                }
            } catch (err) {
                showStatus('hintStatus', err.message, true);
            }
        }

        // ────────────────────────────── IMAGE CONVERTER ──────────────────────────────
        function switchImageMode(mode) {
            currentImageMode = mode;
            const fileSection = document.getElementById('fileInputSection');
            const urlSection = document.getElementById('urlInputSection');
            const fileBtn = document.getElementById('fileModeBtn');
            const urlBtn = document.getElementById('urlModeBtn');

            if (mode === 'file') {
                fileSection.style.display = 'block';
                urlSection.style.display = 'none';
                fileBtn.style.background = 'var(--green)';
                fileBtn.style.border = 'none';
                urlBtn.style.background = 'var(--bg-lighter)';
                urlBtn.style.border = '1px solid var(--border)';
            } else {
                fileSection.style.display = 'none';
                urlSection.style.display = 'block';
                urlBtn.style.background = 'var(--green)';
                urlBtn.style.border = 'none';
                fileBtn.style.background = 'var(--bg-lighter)';
                fileBtn.style.border = '1px solid var(--border)';
            }
        }

        function isCloseToBlack(r, g, b, threshold = 10) {
            return r < threshold && g < threshold && b < threshold;
        }

        function compressColors(colors) {
            if (!colors || colors.length === 0) return [];
            
            const compressed = [];
            let currentColor = colors[0];
            let count = 1;
            
            for (let i = 1; i < colors.length; i++) {
                if (colors[i] === currentColor) {
                    count++;
                } else {
                    if (count > 2) {
                        compressed.push(`${currentColor}*${count}`);
                    } else {
                        for (let j = 0; j < count; j++) {
                            compressed.push(currentColor);
                        }
                    }
                    currentColor = colors[i];
                    count = 1;
                }
            }
            
            // Add last group
            if (count > 2) {
                compressed.push(`${currentColor}*${count}`);
            } else {
                for (let j = 0; j < count; j++) {
                    compressed.push(currentColor);
                }
            }
            
            return compressed;
        }

        async function convertImage() {
            const width = parseInt(document.getElementById('imgWidth').value);
            const height = parseInt(document.getElementById('imgHeight').value);
            const useCompression = document.getElementById('useCompression').checked;

            let imageSource;
            if (currentImageMode === 'file') {
                const fileInput = document.getElementById('imageFile');
                if (!fileInput.files || fileInput.files.length === 0) {
                    showStatus('imageStatus', 'Please select an image file', true);
                    return;
                }
                imageSource = fileInput.files[0];
            } else {
                const urlInput = document.getElementById('imageUrl').value.trim();
                if (!urlInput) {
                    showStatus('imageStatus', 'Please enter an image URL', true);
                    return;
                }
                imageSource = urlInput;
            }

            showStatus('imageStatus', 'Converting image...', false);

            try {
                const img = new Image();
                img.crossOrigin = 'anonymous';

                await new Promise((resolve, reject) => {
                    img.onload = resolve;
                    img.onerror = () => reject(new Error('Failed to load image'));
                    
                    if (typeof imageSource === 'string') {
                        img.src = imageSource;
                    } else {
                        const reader = new FileReader();
                        reader.onload = (e) => { img.src = e.target.result; };
                        reader.onerror = () => reject(new Error('Failed to read file'));
                        reader.readAsDataURL(imageSource);
                    }
                });

                // Create canvas and resize
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                // Get pixel data
                const imageData = ctx.getImageData(0, 0, width, height);
                const pixels = imageData.data;

                // Generate color codes
                const allColors = [];
                for (let i = 0; i < pixels.length; i += 4) {
                    const r = pixels[i];
                    const g = pixels[i + 1];
                    const b = pixels[i + 2];

                    if (isCloseToBlack(r, g, b)) {
                        allColors.push('a');
                    } else {
                        const hex = ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
                        allColors.push(hex);
                    }
                }

                // Apply compression if enabled
                const colorData = useCompression ? compressColors(allColors) : allColors;

                // Create code string
                const resolutionStr = `${width}x${height}`;
                const colorString = colorData.join(' ');
                const codeString = `${resolutionStr}\n${colorString}`;

                // Calculate statistics
                const originalLength = allColors.join(' ').length;
                const compressedLength = colorString.length;
                const compressionRatio = useCompression ? ((1 - compressedLength / originalLength) * 100) : 0;
                const CHAT_LIMIT = 200;

                // Display results
                document.getElementById('generatedCode').value = codeString;
                document.getElementById('imageOutput').style.display = 'block';

                let stats = `Resolution: ${width}x${height}\n`;
                stats += `Total pixels: ${allColors.length}\n`;
                stats += `Original code length: ${originalLength} characters\n`;
                
                if (useCompression) {
                    stats += `Compressed code length: ${compressedLength} characters\n`;
                    stats += `Compression ratio: ${compressionRatio.toFixed(1)}%\n\n`;
                } else {
                    stats += `Code length: ${compressedLength} characters\n\n`;
                }

                if (codeString.length < CHAT_LIMIT) {
                    stats += `✓ Fits in ONE Roblox chat message!\n\n`;
                } else {
                    const chunksNeeded = Math.ceil(codeString.length / CHAT_LIMIT);
                    stats += `⚠ Needs ${chunksNeeded} chat messages (exceeds ${CHAT_LIMIT} char limit)\n`;
                    stats += `  Consider using a smaller resolution or simpler image\n\n`;
                }

                stats += `To use in Roblox:\n  :image <paste the code>`;

                document.getElementById('imageStats').textContent = stats;
                showStatus('imageStatus', 'Image converted successfully!', false);

            } catch (err) {
                showStatus('imageStatus', `Error: ${err.message}`, true);
            }
        }

        function copyCode() {
            const codeArea = document.getElementById('generatedCode');
            codeArea.select();
            document.execCommand('copy');
            
            const originalText = event.target.textContent;
            event.target.textContent = 'Copied!';
            setTimeout(() => {
                event.target.textContent = originalText;
            }, 2000);
        }

        // ────────────────────────────── VIDEO CONVERTER ──────────────────────────────
        async function convertVideo() {
            const fileInput = document.getElementById('videoFile');
            if (!fileInput.files || fileInput.files.length === 0) {
                showStatus('videoStatus', 'Please select a video file', true);
                return;
            }

            const width = parseInt(document.getElementById('videoWidth').value);
            const height = parseInt(document.getElementById('videoHeight').value);
            const fps = parseInt(document.getElementById('videoFPS').value);
            const duration = parseInt(document.getElementById('videoDuration').value);

            const videoFile = fileInput.files[0];
            
            // Show progress
            document.getElementById('videoProgress').style.display = 'block';
            document.getElementById('videoOutput').style.display = 'none';
            updateVideoProgress(10, 'Loading video...');

            try {
                // Create video element
                const video = document.createElement('video');
                video.src = URL.createObjectURL(videoFile);
                video.muted = true;

                await new Promise((resolve, reject) => {
                    video.onloadedmetadata = resolve;
                    video.onerror = () => reject(new Error('Failed to load video'));
                });

                const videoDuration = Math.min(video.duration, duration);
                const frameInterval = 1 / fps;
                const totalFrames = Math.floor(videoDuration * fps);

                updateVideoProgress(20, `Processing ${totalFrames} frames...`);

                // Create canvas for frame extraction
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');

                const frames = [];
                
                for (let i = 0; i < totalFrames; i++) {
                    const currentTime = i * frameInterval;
                    video.currentTime = currentTime;
                    
                    await new Promise(resolve => {
                        video.onseeked = resolve;
                    });

                    // Draw frame to canvas
                    ctx.drawImage(video, 0, 0, width, height);
                    const imageData = ctx.getImageData(0, 0, width, height);
                    const pixels = imageData.data;

                    // Convert pixels to color codes
                    const frameColors = [];
                    for (let j = 0; j < pixels.length; j += 4) {
                        const r = pixels[j];
                        const g = pixels[j + 1];
                        const b = pixels[j + 2];

                        if (isCloseToBlack(r, g, b)) {
                            frameColors.push('a');
                        } else {
                            const hex = ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0').toUpperCase();
                            frameColors.push(hex);
                        }
                    }

                    frames.push(`FRAME${i + 1}, ${frameColors.join(' ')}`);
                    
                    // Update progress
                    const progress = 20 + Math.floor((i / totalFrames) * 70);
                    updateVideoProgress(progress, `Processing frame ${i + 1}/${totalFrames}...`);
                }

                updateVideoProgress(95, 'Generating code...');

                // Create final code string
                const resolutionStr = `${width}x${height}`;
                const codeString = `${resolutionStr}\n${fps}\n${frames.join('\n')}`;

                // Calculate statistics
                const codeLength = codeString.length;
                const estimatedFileSize = (codeLength / 1024).toFixed(2);

                // Display results
                document.getElementById('generatedVideoCode').value = codeString;
                document.getElementById('videoOutput').style.display = 'block';
                updateVideoProgress(100, 'Complete!');

                let stats = `Resolution: ${width}x${height}\n`;
                stats += `FPS: ${fps}\n`;
                stats += `Frames: ${totalFrames}\n`;
                stats += `Duration: ${videoDuration.toFixed(2)}s\n`;
                stats += `Code length: ${codeLength.toLocaleString()} characters\n`;
                stats += `Estimated file size: ${estimatedFileSize} KB\n\n`;
                stats += `To use in Roblox:\n  :video <paste the code>`;

                document.getElementById('videoStats').textContent = stats;
                showStatus('videoStatus', 'Video converted successfully!', false);

                // Clean up
                URL.revokeObjectURL(video.src);

                setTimeout(() => {
                    document.getElementById('videoProgress').style.display = 'none';
                }, 2000);

            } catch (err) {
                showStatus('videoStatus', `Error: ${err.message}`, true);
                document.getElementById('videoProgress').style.display = 'none';
            }
        }

        function updateVideoProgress(percent, text) {
            const fill = document.getElementById('videoProgressFill');
            const textEl = document.getElementById('videoProgressText');
            fill.style.width = percent + '%';
            fill.textContent = percent + '%';
            textEl.textContent = text;
        }

        function copyVideoCode() {
            const codeArea = document.getElementById('generatedVideoCode');
            codeArea.select();
            document.execCommand('copy');
            
            const originalText = event.target.textContent;
            event.target.textContent = 'Copied!';
            setTimeout(() => {
                event.target.textContent = originalText;
            }, 2000);
        }

        function downloadVideoCode() {
            const code = document.getElementById('generatedVideoCode').value;
            const blob = new Blob([code], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'video_code.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // ────────────────────────────── CONSOLE ──────────────────────────────
        const terminal = document.getElementById('terminalOutput');
        const cmdInput = document.getElementById('consoleInput');

        function addLine(text, className = '') {
            const div = document.createElement('div');
            div.className = 'terminal-line ' + className;
            div.textContent = text;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function addPlayerList(players) {
            if (!players || players.length === 0) {
                addLine("  (no players online)", "info");
                return;
            }
            addLine(`  ${players.length} player${players.length === 1 ? '' : 's'}:`, "info");
            players.forEach(p => {
                addLine(`    • ${p.name}  (ID: ${p.userId})`, "player-list");
            });
        }

        async function fetchPlayers(serverId) {
            if (!backendUrl) {
                addLine("Backend not connected", "error");
                return;
            }
            try {
                const res = await fetch(`${backendUrl}/api/players/${serverId}`, {
                    headers: { 'ngrok-skip-browser-warning': '69420' }
                });
                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}`);
                }
                const data = await res.json();
                if (!data.success) {
                    addLine(`Error: ${data.error || "Failed to load players"}`, "error");
                    return;
                }
                addPlayerList(data.players);
            } catch (err) {
                addLine(`Failed to fetch players: ${err.message}`, "error");
            }
        }

        async function sendModCommand(type, serverId, playerName, reason) {
            if (!backendUrl) {
                addLine("Backend not connected", "error");
                return;
            }
            try {
                const res = await fetch(`${backendUrl}/api/${type}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': '69420'
                    },
                    body: JSON.stringify({ serverId, playerName, reason })
                });
                const data = await res.json();
                if (data.success) {
                    addLine(`[${type.toUpperCase()}] #${data.modNum || '?'} queued → "${playerName}" on ${serverId}`, "success");
                    if (reason && reason !== "No reason provided") {
                        addLine(`  Reason: ${reason}`, "info");
                    }
                } else {
                    addLine(`Error: ${data.error || "Request failed"}`, "error");
                }
            } catch (err) {
                addLine(`Network error: ${err.message}`, "error");
            }
        }

        function startConsoleCooldown() {
            consoleCooldown = true;
            cmdInput.disabled = true;
            cmdInput.placeholder = 'Cooldown active...';
            
            let remaining = 5;
            addLine(`⏱ Cooldown: ${remaining}s`, 'info');
            
            consoleCooldownTimer = setInterval(() => {
                remaining--;
                if (remaining > 0) {
                    const lines = terminal.querySelectorAll('.terminal-line');
                    const lastLine = lines[lines.length - 1];
                    if (lastLine && lastLine.textContent.startsWith('⏱')) {
                        lastLine.textContent = `⏱ Cooldown: ${remaining}s`;
                    }
                } else {
                    clearInterval(consoleCooldownTimer);
                    cmdInput.disabled = false;
                    cmdInput.placeholder = 'type command...';
                    consoleCooldown = false;
                    addLine('✓ Ready', 'success');
                    cmdInput.focus();
                }
            }, 1000);
        }

        function handleCommand(raw) {
            const cmd = raw.trim();
            if (!cmd) return;
            
            if (consoleCooldown) {
                addLine('> ' + cmd);
                addLine('⚠ Command on cooldown, please wait', 'error');
                return;
            }
            
            addLine('> ' + cmd);

            const parts = cmd.split(/\s+/);
            const action = parts[0].toLowerCase();
            const args = parts.slice(1);

            switch (action) {
                case 'cmds':
                case 'help':
                    addLine('Available commands:', 'info');
                    addLine('  plrs <serverId>                        → list players in server', 'info');
                    addLine('  kick <serverId> <playername> [reason]  → kick player', 'info');
                    addLine('  ban  <serverId> <playername> [reason]  → ban (kick + note)', 'info');
                    addLine('  kill <serverId> <playername>           → kill player', 'info');
                    addLine('  cmds / help                            → this list', 'info');
                    addLine('');
                    startConsoleCooldown();
                    break;

                case 'plrs':
                    if (args.length !== 1) {
                        addLine("Usage: plrs <serverId>", 'error');
                        addLine("Example: plrs server1", 'info');
                        return;
                    }
                    const serverId = args[0];
                    addLine(`Fetching players on ${serverId}...`, 'info');
                    fetchPlayers(serverId);
                    startConsoleCooldown();
                    break;

                case 'kick':
                case 'ban':
                case 'kill':
                    if (args.length < 2) {
                        addLine(`Usage: ${action} <serverId> <playername> [reason]`, 'error');
                        return;
                    }
                    const modServerId = args[0];
                    const playerName = args[1];
                    const reason = args.slice(2).join(' ') || 'No reason provided';
                    sendModCommand(action, modServerId, playerName, reason);
                    startConsoleCooldown();
                    break;

                default:
                    addLine(`Unknown command: ${action}`, 'error');
                    addLine("Type 'cmds' for help", 'info');
                    startConsoleCooldown();
            }
        }

        cmdInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const val = cmdInput.value;
                if (val.trim()) handleCommand(val);
                cmdInput.value = '';
            }
        });

        terminal.addEventListener('click', () => {
            if (!consoleCooldown) cmdInput.focus();
        });
    </script>
